<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Health | Health Care Guide</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f9fc;
    color: #183247;
}

header {
    background: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 15px #dce8ee;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #087e8b;
    font-size: 27px;
    font-weight: bold;
}

select {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.hero {
    padding: 75px 8%;
    text-align: center;
    background: linear-gradient(120deg, #087e8b, #21b6a8);
    color: white;
}

.hero h1 {
    font-size: 43px;
    margin-bottom: 18px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 25px;
}

.search {
    max-width: 550px;
    margin: auto;
    display: flex;
    background: white;
    padding: 7px;
    border-radius: 12px;
}

.search input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: none;
    outline: none;
    font-size: 16px;
}

.search button {
    background: #ffb703;
    border: none;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.section {
    padding: 55px 8%;
}

.section h2 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 30px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 15px;
    box-shadow: 0 4px 18px #dce8ee;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
}

.emoji {
    font-size: 40px;
}

.card h3 {
    margin: 15px 0;
    color: #087e8b;
}

.card p {
    line-height: 1.6;
    color: #526575;
}

.card button {
    margin-top: 18px;
    padding: 11px 18px;
    background: #087e8b;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.card button:hover {
    background: #065e68;
}

.notice {
    background: #fff4d6;
    margin: 10px 8% 40px;
    padding: 20px;
    border-radius: 12px;
    line-height: 1.6;
}

footer {
    background: #123b4a;
    color: white;
    text-align: center;
    padding: 25px;
    line-height: 1.8;
}

/* Disease details popup */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 550px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    line-height: 1.8;
}

.modal-content h2 {
    color: #087e8b;
    margin-bottom: 15px;
}

.modal-content p {
    white-space: pre-line;
}

.close-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: #087e8b;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.no-results {
    text-align: center;
    padding: 25px;
    grid-column: 1 / -1;
}

@media(max-width:600px) {
    .hero h1 {
        font-size: 30px;
    }

    header {
        padding: 18px 5%;
    }

    .section {
        padding: 40px 5%;
    }
}

/* Category Filter Design */

.category-filter {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 25px 0;
}

.category-filter button {
    background: #ffffff;
    color: #07566b;
    border: 2px solid #07566b;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.category-filter button:hover {
    background: #07566b;
    color: white;
    transform: translateY(-2px);
}

/* ===== PROFESSIONAL HEALTH POPUP ===== */

.modal {
    backdrop-filter: blur(5px);
    background: rgba(0, 0, 0, 0.65);
    padding: 15px;
}

.modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    animation: popupShow 0.35s ease;
}

@keyframes popupShow {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Popup Title */

#modalTitle {
    color: #07566b;
    font-size: 25px;
    margin-bottom: 22px;
    border-bottom: 2px solid #e5eeee;
    padding-bottom: 15px;
}

/* Section Headings */

#modalText h3 {
    font-size: 18px;
    margin-top: 22px;
    margin-bottom: 8px;
}

/* Symptoms */

#modalText h3:nth-of-type(1) {
    color: #e63946;
}

/* Causes */

#modalText h3:nth-of-type(2) {
    color: #f77f00;
}

/* Prevention */

#modalText h3:nth-of-type(3) {
    color: #2a9d55;
}

/* Treatment */

#modalText h3:nth-of-type(4) {
    color: #1976d2;
}

/* Doctor Advice */

#modalText h3:nth-of-type(5) {
    color: #8e44ad;
}

/* Paragraph */

#modalText p {
    color: #444444;
    font-size: 15px;
    line-height: 1.8;
    background: #f5f9fa;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 12px;
}

/* Close Button */

.modal-content .close-btn {
    background: #07566b;
    color: white;
    border: none;
    padding: 11px 28px;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 20px;
}

.modal-content .close-btn:hover {
    background: #043e4e;
}

/* Mobile Responsive */

@media (max-width: 600px) {
    .modal-content {
        padding: 20px;
        max-height: 88vh;
    }

    #modalTitle {
        font-size: 21px;
    }

    #modalText h3 {
        font-size: 16px;
    }

    #modalText p {
        font-size: 14px;
    }
}

</style>
</head>

// CREATE DISEASE CARDS
let selectedCategory = "all";
function renderCards() {
    const lang = document.getElementById("language").value;
    const cards = document.getElementById("cards");
const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
console.log("Search Text:", searchText);
console.log("diseases:",diseases.length);

    cards.innerHTML = "";

    diseases.filter(disease => {

    const categoryMatch =
        selectedCategory === "all" ||
        disease.category === selectedCategory;

const searchMatch = [
    ...(disease.name || []),
    ...(disease.desc || []),
    ...(disease.keywords || []),
    disease.id || ""
].join(" ").toLowerCase().includes(searchText);

    return categoryMatch && searchMatch;

}).forEach(disease => {
        const index = lang === "en" ? 0 : lang === "te" ? 1 : 2;

        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = disease.id;

        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = disease.emoji;

        const title = document.createElement("h3");
        title.textContent = disease.name[index];

        const description = document.createElement("p");
        description.textContent = disease.desc[index];

        const button = document.createElement("button");
        button.textContent = translations[lang].read;
        button.onclick = () => showInfo(disease.id);

        card.append(emoji, title, description, button);
        cards.appendChild(card);
        
    });
}
function filterCategory(category) {
    selectedCategory = category;
    renderCards();
}


// CHANGE WEBSITE LANGUAGE

function changeLanguage() {
    const lang = document.getElementById("language").value;
    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("heading").textContent = t.heading;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("diseaseTitle").textContent = t.diseaseTitle;

    document.getElementById("searchBtn").textContent = t.search;
    document.getElementById("searchInput").placeholder = t.placeholder;

    document.getElementById("notice").innerHTML = t.notice;
    document.getElementById("copyright").textContent = t.copyright;
    document.getElementById("footerText").textContent = t.footer;
    document.getElementById("closeBtn").textContent = t.close;

    renderCards();
    searchDisease();
    closeInfo();
}


// SEARCH DISEASE

function searchDisease() {
    renderCards();
}


// SHOW DISEASE DETAILS


function showInfo(id) {

    const disease = diseases.find(item => item.id === id);
    if (!disease) return;

    const lang = document.getElementById("language").value;
    const index = lang === "en" ? 0 : lang === "te" ? 1 : 2;

    const labels = {
        en: ["Symptoms", "Causes", "Prevention", "Treatment", "When to consult a doctor"],
        te: ["లక్షణాలు", "కారణాలు", "నివారణ", "చికిత్స", "ఎప్పుడు డాక్టర్‌ను సంప్రదించాలి"],
        hi: ["लक्षण", "कारण", "बचाव", "उपचार", "डॉक्टर से कब मिलें"]
    };

    const langLabels = labels[lang] || labels.en;

    document.getElementById("modalTitle").textContent =
        disease.emoji + " " + disease.name[index];

    const modalText = document.getElementById("modalText");

    if (disease.details) {

        const sections = [
            "symptoms",
            "causes",
            "prevention",
            "treatment",
            "doctor"
        ];

        modalText.innerHTML = "";

        sections.forEach((section, i) => {

            const heading = document.createElement("h3");
            heading.textContent = langLabels[i];

            const paragraph = document.createElement("p");
            paragraph.textContent =
    disease.details[section]?.[index] || "Information coming soon.";

            modalText.appendChild(heading);
            modalText.appendChild(paragraph);

        });

    } else {
        modalText.textContent = disease.info[index];
    }

    document.getElementById("modal").style.display = "flex";
}



// CLOSE POPUP

function closeInfo() {
    document.getElementById("modal").style.display = "none";
}


// CHANGE LANGUAGE WHEN SELECTED

document.getElementById("language").addEventListener(
    "change",
    function() {
        localStorage.setItem("ourHealthLanguage", this.value);
        changeLanguage();
    }
);


// SEARCH WHILE TYPING

document.getElementById("searchInput").addEventListener(
    "input",
    searchDisease
);


// CLOSE POPUP WHEN CLICKING OUTSIDE

document.getElementById("modal").addEventListener(
    "click",
    function(event) {
        if (event.target === this) {
            closeInfo();
        }
    }
);


// LOAD SAVED LANGUAGE

const savedLanguage = localStorage.getItem("ourHealthLanguage");

if (savedLanguage && translations[savedLanguage]) {
    document.getElementById("language").value = savedLanguage;
}

changeLanguage();

</script>
